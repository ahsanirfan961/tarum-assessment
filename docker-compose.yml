services:
  minio:
    # The official minio/minio repository has been removed from Docker Hub, so
    # the plan's pinned community tag no longer pulls. This is the maintained
    # Chainguard build, pinned by digest (its free tier only publishes
    # `latest`). See docs/integration/README.md.
    image: cgr.dev/chainguard/minio@sha256:bd014394a80898e68c149f2311fdf8d5a2c2f3bb2c33b9327ae6d02b4b065ae1
    # The image's entrypoint is the minio binary itself.
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-fomi}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-fomi-dev-secret}
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # web console, for browsing objects while debugging
    volumes:
      - minio-data:/data
    # No healthcheck: the image ships no shell, curl or mc to run one with.
    # The app creates the bucket on first use and surfaces a clear error if
    # MinIO isn't reachable yet.

volumes:
  minio-data:
